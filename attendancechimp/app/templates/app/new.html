<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - AttendanceChimp</title>
</head>
<body>
    <h1>Sign Up for AttendanceChimp</h1>

    <form method="POST" action="/app/createUser">
        <p>
            Username:
            <input type="text" name="user_name" required>
        </p>

        <p>
            Email:
            <input type="email" name="email" required>
        </p>

        <p>
            Password:
            <input type="password" name="password" required>
        </p>

        <p>Account Type:</p>

        <input type="radio" name="is_student" value="1" required>
        Student
        <br>

        <input type="radio" name="is_student" value="0">
        Instructor
        <br><br>

        <button type="submit">Sign Up</button>
    </form>
</body>
</html>
