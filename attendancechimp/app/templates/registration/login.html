<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log In - AttendanceChimp</title>
</head>
<body style="text-align:center; font-family:Arial;">

    <h1>Log In</h1>

    <form method="POST">
        {% csrf_token %}

        <p>
            Username:
            <input type="text" name="username" required>
        </p>

        <p>
            Password:
            <input type="password" name="password" required>
        </p>

        <button type="submit">Log In</button>
    </form>

</body>
</html>
